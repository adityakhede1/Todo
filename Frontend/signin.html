<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signin</title>
    <!-- The starting "/" means: always start from website root -->
    <link rel="stylesheet" href="/sign.css">   
    <!-- axios - an external library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.6/axios.min.js"></script>
</head>

<body>

    <div class="signin-box">
        <h2>Sign In</h2>

        <input id="email" type="email" placeholder="Enter Email">
        <input id="password" type="password" placeholder="Enter Password">

        <button id="button" onclick="signin()">Sign In</button>
        <div>
            Don't have a account ?
            <a href="/user/signup">SignUp now</a>
        </div> 
    </div>

    <script>
        
        document.getElementById("password").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                const button = document.getElementById("button");
                button.click();
            }
        });

        async function signin(){

            // e.preventDefault(); for form submission

            const email = document.getElementById("email").value
            const password = document.getElementById("password").value

            try {
                const response = await axios.post(
                "https://todo-cdz9.onrender.com/user/signin",
                {
                    email: email, 
                    password: password
                }
                );

                // Backend response
                const data = response.data;

                if (data.success) {
                    // Redirect user
                    window.location.href = "https://todo-cdz9.onrender.com/todo/app";
                } else {
                    alert(data.message);
                }
            } catch (err) {
                console.log(err);
            }
        }

    </script>

</body>

</html>
